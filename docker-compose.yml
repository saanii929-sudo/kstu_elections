services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # MONGODB_URI comes entirely from .env below, not an `environment:`
    # override here — docker-compose lets environment: silently win over
    # env_file: for the same key, which previously meant a hardcoded
    # MONGODB_URI here always overrode whatever .env correctly had, no
    # matter what. Set MONGODB_URI in .env directly: inside this compose
    # network the database is reachable at the service name "mongo", not
    # localhost — e.g. mongodb://mongo:27017/<db> with no auth, or
    # mongodb://user:pass@mongo:27017/<db>?authSource=admin once auth is
    # enabled on the mongo service below (both must use the SAME
    # credentials — see MONGO_ROOT_USERNAME/PASSWORD there).
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      # Both unset by default = mongod runs with no auth, exactly as
      # before (the official image's entrypoint only enables --auth once
      # BOTH of these are non-empty). See the deployment note in
      # .env.example before setting these on a deployment that already has
      # data in its mongo_data volume — enabling auth there needs a manual
      # step first, or the app (and everything else) loses DB access.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # No credentials here on purpose — `ping` is allowed pre-auth, so
      # this works unchanged whether or not auth ends up enabled above.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
